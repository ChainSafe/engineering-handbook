# Lychee link-check configuration
# See https://lychee.cli.rs/ for the full reference.

#############
# Behaviour #
#############

# Verbose output makes CI failures self-explanatory.
verbose = "info"

# Treat 200, 204, 206, 301, 302, 304, 307, 308 as success.
# 403 is allowed because some hosts rate-limit unauthenticated probes (the link
# is probably fine; treating 403 as failure produces flaky CI).
accept = ["200..=299", "301..=308", "403"]

# Reasonable timeouts for slow upstreams.
timeout = 30
max_retries = 3
retry_wait_time = 10

# GitHub limits unauthenticated request rates; pass a token in CI to lift the
# limit. The workflow injects this automatically when running on GH Actions.
# Locally: `lychee --github-token $(gh auth token) ...`

#######################
# Inclusion patterns  #
#######################

# Check both file links and bare URLs.
include_verbatim = true

# Relative links resolve against each file's own location by default;
# the old `base` key was removed upstream, so no base setting is needed.

####################
# Excluded targets #
####################

# Skip mail-to and tel: URIs; they aren't reachable by HTTP.
# The Daml MCP server endpoint (daml-autopilot) is a parameterized, auth-gated
# SSE endpoint — it carries a `payerParty` query param and is not a GET-probeable
# web page, so exclude it from link-checking (it appears in a config example in
# languages/daml/developer.md).
exclude = [
    "^mailto:",
    "^tel:",
    '^https://mcp-server\.chainsafe\.io',
    '^chainsafe\.tech'
]

# No excluded paths — all markdown is in scope.
exclude_path = [
]

###########
# Caching #
###########

# Match the workflow's --cache flag.
cache = true
max_cache_age = "1d"
